<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STL Assembler – ghép và thử màu mô hình</title>
<style>
:root{--bg:#1c1f24;--panel:#262a31;--line:#3a404a;--text:#e8eaed;--mute:#9aa3ae;--accent:#4aa3ff;--warn:#ffb454}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:grid;grid-template-columns:260px 1fr 250px;grid-template-rows:1fr}
aside{background:var(--panel);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
aside.left{border-right:1px solid var(--line)}aside.right{border-left:1px solid var(--line)}
h1{font-size:16px;margin:0}h2{font-size:13px;margin:0;color:var(--mute);font-weight:600}
button,.btn{font:inherit;color:var(--text);background:#333944;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover,.btn:hover{background:#3e4552}
button.on{background:var(--accent);border-color:var(--accent);color:#06121f}
button:focus-visible,input:focus-visible,.btn:focus-within{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input[type=color]{width:28px;height:24px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
#drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--mute)}
#drop.over{border-color:var(--accent);color:var(--text)}
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
#list li{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;border:1px solid transparent}
#list li.sel{border-color:var(--accent);background:#2d3440}
#list .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;background:none;border:0;text-align:left;padding:2px}
#list .x{padding:0 7px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px}
#view{position:relative;min-width:0;background:#e6e9ee}
#view canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:12px;bottom:12px;right:12px;background:rgba(28,31,36,.88);color:var(--text);padding:8px 12px;border-radius:8px;pointer-events:none}
label.chk{display:flex;gap:6px;align-items:center}
.muted{color:var(--mute);font-size:12px}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:55vh auto auto}#view{order:-1}aside.left,aside.right{border:0}}
</style>
</head>
<body>
<aside class="left">
  <h1>STL Assembler</h1>
  <div id="drop"><label class="btn">Chọn file STL<input id="file" type="file" accept=".stl" multiple hidden></label><p class="muted" style="margin:8px 0 0">hoặc kéo thả nhiều file vào đây</p></div>
  <h2>Các phần</h2>
  <ul id="list"></ul>
  <p id="empty" class="muted">Chưa có phần nào.</p>
  <button id="frame">Căn khung nhìn</button>
</aside>

<div id="view"><div id="hint">Thêm file STL để bắt đầu.</div></div>

<aside class="right">
  <h2>Cách di chuyển</h2>
  <div class="row">
    <button data-mode="translate" class="on">Dời (W)</button>
    <button data-mode="rotate">Xoay (E)</button>
    <button data-mode="scale">Co giãn (R)</button>
  </div>
  <label class="chk"><input id="snapGrid" type="checkbox"> Bám lưới (5 đơn vị, 15°)</label>
  <h2>Ghép theo mặt/điểm</h2>
  <button id="snapBtn">Ghép điểm</button>
  <label class="chk"><input id="alignFace" type="checkbox" checked> Xoay cho hai mặt úp vào nhau</label>
  <h2>Nhập số chính xác</h2>
  <div class="grid3" id="posGrid"><label>X<input type="number" step="any" id="px"></label><label>Y<input type="number" step="any" id="py"></label><label>Z<input type="number" step="any" id="pz"></label></div>
  <div class="grid3"><label>Xoay X°<input type="number" step="any" id="rx"></label><label>Xoay Y°<input type="number" step="any" id="ry"></label><label>Xoay Z°<input type="number" step="any" id="rz"></label></div>
  <label class="muted">Tỉ lệ<input type="number" step="any" min="0.001" id="sc"></label>
  <p class="muted">Chọn một phần trong danh sách hoặc bấm vào nó trên màn hình. Phím Delete để xóa phần đang chọn.</p>
</aside>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TransformControls} from 'three/addons/controls/TransformControls.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';

THREE.Object3D.DEFAULT_UP.set(0,0,1); // STL/CAD dùng trục Z hướng lên
const $=id=>document.getElementById(id);
const view=$('view'), hint=$('hint');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xe6e9ee);
const camera=new THREE.PerspectiveCamera(45,1,0.1,1e6); camera.position.set(250,-300,200);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(devicePixelRatio); view.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f99,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.6); sun.position.set(200,-300,500); scene.add(sun);
const grid=new THREE.GridHelper(600,60,0x8a93a0,0xc3c9d2); grid.rotation.x=Math.PI/2; scene.add(grid);

const orbit=new OrbitControls(camera,renderer.domElement); orbit.enableDamping=true;
const tc=new TransformControls(camera,renderer.domElement); scene.add(tc);
tc.addEventListener('dragging-changed',e=>orbit.enabled=!e.value);
tc.addEventListener('objectChange',fillFields);

const parts=[]; let sel=null, nextX=0, n=0;
const colors=[0x4aa3ff,0xff7a59,0x6fcf97,0xf2c94c,0xbb86fc,0xe0e0e0];

function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(view); resize();
(function loop(){requestAnimationFrame(loop);orbit.update();renderer.render(scene,camera)})();

function addSTL(name,buf){
  let geo; try{geo=new STLLoader().parse(buf)}catch(e){alert('Không đọc được '+name);return}
  geo.computeVertexNormals(); geo.center(); geo.computeBoundingBox();
  const size=geo.boundingBox.getSize(new THREE.Vector3());
  const mat=new THREE.MeshStandardMaterial({color:colors[n++%colors.length],roughness:.55,metalness:.05});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(nextX+size.x/2,0,size.z/2); nextX+=size.x+20;
  mesh.userData.name=name.replace(/\.stl$/i,''); scene.add(mesh); parts.push(mesh); select(mesh); frame();
}
async function loadFiles(files){for(const f of files){if(/\.stl$/i.test(f.name))addSTL(f.name,await f.arrayBuffer())}}
$('file').onchange=e=>{loadFiles(e.target.files);e.target.value=''};
const drop=$('drop');
['dragover','dragenter'].forEach(t=>addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
addEventListener('drop',e=>{e.preventDefault();loadFiles(e.dataTransfer.files)});

function select(m){
  if(sel)sel.material.emissive.set(0);
  sel=m; if(m){m.material.emissive.set(0x10304f);tc.attach(m)}else tc.detach();
  renderList(); fillFields(); setHint();
}
function remove(m){tc.detach();scene.remove(m);m.geometry.dispose();m.material.dispose();parts.splice(parts.indexOf(m),1);if(sel===m)sel=null;select(parts[0]||null)}
function renderList(){
  const ul=$('list'); ul.innerHTML=''; $('empty').hidden=parts.length>0;
  parts.forEach(m=>{
    const li=document.createElement('li'); if(m===sel)li.className='sel';
    const c=document.createElement('input'); c.type='color'; c.value='#'+m.material.color.getHexString(); c.title='Đổi màu'; c.oninput=()=>m.material.color.set(c.value);
    const b=document.createElement('button'); b.className='name'; b.textContent=m.userData.name; b.onclick=()=>select(m);
    const v=document.createElement('input'); v.type='checkbox'; v.checked=m.visible; v.title='Hiện/ẩn'; v.onchange=()=>{m.visible=v.checked;if(!v.checked&&sel===m)tc.detach();else if(sel===m)tc.attach(m)};
    const x=document.createElement('button'); x.className='x'; x.textContent='×'; x.title='Xóa'; x.onclick=()=>remove(m);
    li.append(c,b,v,x); ul.append(li);
  });
}
const F={px:['position','x'],py:['position','y'],pz:['position','z']};
function fillFields(){
  const d=!sel; ['px','py','pz','rx','ry','rz','sc'].forEach(i=>$(i).disabled=d); if(!sel)return;
  const r=v=>+v.toFixed(3), D=180/Math.PI;
  $('px').value=r(sel.position.x);$('py').value=r(sel.position.y);$('pz').value=r(sel.position.z);
  $('rx').value=r(sel.rotation.x*D);$('ry').value=r(sel.rotation.y*D);$('rz').value=r(sel.rotation.z*D);$('sc').value=r(sel.scale.x);
}
['px','py','pz'].forEach(i=>$(i).oninput=e=>{if(sel&&e.target.value!=='')sel.position[i[1]]=+e.target.value});
['rx','ry','rz'].forEach(i=>$(i).oninput=e=>{if(sel&&e.target.value!=='')sel.rotation[i[1]]=+e.target.value*Math.PI/180});
$('sc').oninput=e=>{if(sel&&+e.target.value>0)sel.scale.setScalar(+e.target.value)};

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function setMode(m){tc.setMode(m);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m))}
$('snapGrid').onchange=e=>{tc.setTranslationSnap(e.target.checked?5:null);tc.setRotationSnap(e.target.checked?THREE.MathUtils.degToRad(15):null);tc.setScaleSnap(e.target.checked?0.1:null)};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type==='number')return;
  if(e.key==='w')setMode('translate'); if(e.key==='e')setMode('rotate'); if(e.key==='r')setMode('scale');
  if(e.key==='Delete'&&sel)remove(sel); if(e.key==='Escape')snapReset();
});
function frame(){
  if(!parts.length)return; const box=new THREE.Box3(); parts.forEach(m=>box.expandByObject(m));
  const c=box.getCenter(new THREE.Vector3()), r=Math.max(box.getSize(new THREE.Vector3()).length(),50);
  orbit.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(.8,-1,.6).normalize().multiplyScalar(r*1.3)); camera.near=r/1000; camera.far=r*100; camera.updateProjectionMatrix();
}
$('frame').onclick=frame;

// ---- Ghép điểm: bấm điểm A trên phần đang chọn, rồi điểm B trên phần khác ----
let snapOn=false, A=null; const marker=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xff2d55,depthTest:false})); marker.renderOrder=9; marker.visible=false; scene.add(marker);
$('snapBtn').onclick=()=>{snapOn=!snapOn;snapReset();$('snapBtn').classList.toggle('on',snapOn);renderer.domElement.style.cursor=snapOn?'crosshair':'';setHint()};
function snapReset(){A=null;marker.visible=false;setHint()}
function setHint(){
  hint.textContent=!parts.length?'Thêm file STL để bắt đầu.':!snapOn?'Bấm vào một phần để chọn. Kéo chuột để xoay camera, cuộn để phóng to.':!A?'Ghép điểm – bước 1: bấm một điểm trên phần đang chọn.':'Ghép điểm – bước 2: bấm điểm trên phần khác để dính vào. Esc để hủy.'}
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let down=null, onGizmo=false;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];onGizmo=tc.axis!==null});
cv.addEventListener('pointerup',e=>{
  if(!down||onGizmo||Math.hypot(e.clientX-down[0],e.clientY-down[1])>4)return;
  const r=cv.getBoundingClientRect(); mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(mouse,camera);
  const vis=parts.filter(m=>m.visible);
  if(!snapOn){const h=ray.intersectObjects(vis)[0];select(h?h.object:null);return}
  if(!sel)return;
  const targets=A?vis.filter(m=>m!==sel):[sel], h=ray.intersectObjects(targets)[0]; if(!h)return;
  const nw=h.face.normal.clone().transformDirection(h.object.matrixWorld);
  if(!A){A={p:h.point.clone(),n:nw};marker.position.copy(h.point);marker.scale.setScalar(Math.max(1,camera.position.distanceTo(h.point)/150));marker.visible=true;setHint();return}
  let pA=A.p.clone();
  if($('alignFace').checked){
    const q=new THREE.Quaternion().setFromUnitVectors(A.n,nw.clone().negate());
    sel.quaternion.premultiply(q); pA.sub(sel.position).applyQuaternion(q).add(sel.position);
  }
  sel.position.add(h.point.clone().sub(pA)); fillFields(); snapReset();
});
setHint(); fillFields(); renderList();
</script>
</body>
</html>
